<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPDP Compliance Gap Audit & Diagnostic Request | CraftEgon CCS</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/service-page.css">
</head>
<body>
  <div id="global-navbar"></div>

  <main class="container" style="padding: 3rem 1.5rem; max-width: 800px;">
    <nav class="if-breadcrumb" aria-label="Breadcrumb">
      <a href="/index.html">Home</a> / <a href="/verticals/15-it-digital.html">IT & Digital Compliance</a> / <span>DPDP Audit Request</span>
    </nav>
    
    <div class="if-service-hero" style="text-align: left; padding: 2rem 0;">
      <h1>DPDP Act Compliance Diagnostic & Audit Booking</h1>
      <p>Run your platform parameters through our digital compliance diagnostic tool and submit your details for senior CISO and data privacy legal counsel review.</p>
    </div>

    <div style="background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 2.5rem; box-shadow: var(--shadow-sm);">
      <form class="if-lead-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Platform / Company Name</label>
            <input type="text" name="platform_name" required placeholder="e.g. SaaS Platform Inc." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Data Volume Handled (Monthly Active Users)</label>
            <select name="data_volume" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
              <option value="under-10k">Under 10,000 Users</option>
              <option value="10k-100k">10,000 to 100,000 Users</option>
              <option value="100k-1m">100,000 to 1 Million Users</option>
              <option value="1m-plus">1 Million+ Users (Significant Data Fiduciary)</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Primary Compliance Focus</label>
            <select name="focus_area" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
              <option value="dpdp-audit">DPDP Act Data Fiduciary Governance Audit</option>
              <option value="saas-terms">SaaS Terms of Service & Privacy Architecture</option>
              <option value="incident-response">CERT-In / Cyber Incident Response Setup</option>
              <option value="full-stack">Full Digital Compliance Package</option>
            </select>
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Do you process children's data or sensitive personal data?</label>
            <select name="sensitive_data" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
              <option value="no">Standard Personal Data Only</option>
              <option value="yes">Yes (Financial / Health / Children's Data)</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">CTO / CISO / Contact Name</label>
            <input type="text" name="contact_name" required placeholder="Full Name & Title" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Direct Phone Number</label>
            <input type="tel" name="phone" required placeholder="9876543210" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div>
          <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Official Email Address</label>
          <input type="email" name="email" required placeholder="security@platform.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
        </div>

        <button type="submit" class="if-btn-primary" style="margin-top: 0.5rem; width: 100%; padding: 0.85rem; font-size: 1rem;">Submit DPDP Diagnostic & Book Audit</button>
      </form>
    </div>
  </main>

  <div id="global-footer"></div>
  <script src="/assets/js/navigation.js"></script>
  <script src="/assets/js/forms.js"></script>
</body>
</html>
