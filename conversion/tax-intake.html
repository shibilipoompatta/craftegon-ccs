<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tax Audit & Filing Intake Portal | CraftEgon CCS</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/service-page.css">
</head>
<body>
  <div id="global-navbar"></div>

  <main class="container" style="padding: 3rem 1.5rem; max-width: 800px;">
    <nav class="if-breadcrumb" aria-label="Breadcrumb">
      <a href="/index.html">Home</a> / <a href="/verticals/03-tax-compliance.html">Tax Compliance</a> / <span>Tax Intake Portal</span>
    </nav>
    
    <div class="if-service-hero" style="text-align: left; padding: 2rem 0;">
      <h1>Corporate Tax Audit & Filing Intake Portal</h1>
      <p>Submit your organizational parameters and compliance requirements securely to initiate senior Chartered Accountant review.</p>
    </div>

    <div style="background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 2.5rem; box-shadow: var(--shadow-sm);">
      <form class="if-lead-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Entity / Business Name</label>
            <input type="text" name="entity_name" required placeholder="e.g. CraftEgon LLP" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">PAN Number</label>
            <input type="text" name="pan" required placeholder="ABCDE1234F" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Select Tax Service Required</label>
            <select name="tax_service" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
              <option value="gst-annual">GST Annual Return (GSTR-9 & 9C)</option>
              <option value="itr7">ITR-7 Filing (Companies / Trusts)</option>
              <option value="proprietorship">Proprietorship / SME Tax Filing</option>
              <option value="form-10b">Form 10B / 10BB Trust Audit</option>
              <option value="form-3ceb">Form 3CEB Transfer Pricing</option>
            </select>
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Approx. Annual Turnover</label>
            <select name="turnover" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
              <option value="under-1cr">Under ₹1 Crore</option>
              <option value="1cr-5cr">₹1 Crore to ₹5 Crores</option>
              <option value="5cr-50cr">₹5 Crores to ₹50 Crores</option>
              <option value="above-50cr">Above ₹50 Crores</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Contact Person Name</label>
            <input type="text" name="contact_name" required placeholder="Full Name" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Mobile Number</label>
            <input type="tel" name="phone" required placeholder="9876543210" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div>
          <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Email Address</label>
          <input type="email" name="email" required placeholder="finance@company.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
        </div>

        <button type="submit" class="if-btn-primary" style="margin-top: 1rem; width: 100%; padding: 0.85rem; font-size: 1rem;">Submit Tax Intake for CA Review</button>
      </form>
    </div>
  </main>

  <div id="global-footer"></div>
  <script src="/assets/js/navigation.js"></script>
  <script src="/assets/js/forms.js"></script>
</body>
</html>
