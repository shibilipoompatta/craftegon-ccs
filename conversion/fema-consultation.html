  <main class="container" style="padding: 3rem 1.5rem; max-width: 800px;">

    <div class="if-service-hero" style="text-align: left; padding: 2rem 0;">
      <h1>Specialized FEMA & Cross-Border Subsidiary Desk Consultation</h1>
      <p>Connect with our senior international corporate compliance partners for RBI FIRMS portal filings, foreign subsidiary setups, and cross-border structuring.</p>
    </div>

    <div style="background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 2.5rem; box-shadow: var(--shadow-sm);">
      <form class="if-lead-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Entity / Parent MNC Name</label>
            <input type="text" name="entity_name" required placeholder="e.g. Global Holdings Inc." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Primary Cross-Border Requirement</label>
            <select name="fema_service" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
              <option value="firms-fdi">RBI FIRMS Portal FDI / FC-GPR Reporting</option>
              <option value="bo-lo">Branch Office (BO) / Liaison Office (LO) Compliance</option>
              <option value="fla-return">Annual RBI FLA Return Filing</option>
              <option value="odi-structuring">Outbound Investment (ODI) Structuring</option>
            </select>
          </div>
        </div>

        <div>
          <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Transaction Context & Inbound/Outbound Details</label>
          <textarea name="context" rows="4" placeholder="Describe the jurisdictions involved, capital inflow/outflows, or specific FEMA compliance deadlines..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-family: inherit;"></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Director / Legal Counsel Name</label>
            <input type="text" name="contact_name" required placeholder="Full Name & Title" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Direct Phone Number</label>
            <input type="tel" name="phone" required placeholder="+1 or +91..." style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div>
          <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Official Corporate Email</label>
          <input type="email" name="email" required placeholder="legal@parentmnc.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
        </div>

        <button type="submit" class="if-btn-primary" style="margin-top: 0.5rem; width: 100%; padding: 0.85rem; font-size: 1rem;">Schedule Specialized FEMA Desk Consultation</button>
      </form>
    </div>
