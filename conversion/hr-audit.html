<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Statutory Compliance Audit Request | CraftEgon CCS</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="stylesheet" href="/assets/css/service-page.css">
</head>
<body>
  <div id="global-navbar"></div>

  <main class="container" style="padding: 3rem 1.5rem; max-width: 800px;">
    <nav class="if-breadcrumb" aria-label="Breadcrumb">
      <a href="/index.html">Home</a> / <a href="/verticals/07-labour-hr.html">Labour & HR</a> / <span>HR Audit Request</span>
    </nav>
    
    <div class="if-service-hero" style="text-align: left; padding: 2rem 0;">
      <h1>HR Statutory Compliance Audit Checklist & Retainer Proposal</h1>
      <p>Submit your workforce parameters and compliance checklist requirements to receive a customized legal retainer proposal from our senior HR law advisory desk.</p>
    </div>

    <div style="background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 2.5rem; box-shadow: var(--shadow-sm);">
      <form class="if-lead-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Organization Name</label>
            <input type="text" name="org_name" required placeholder="e.g. CraftEgon Technologies" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Total Employee Headcount</label>
            <select name="headcount" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
              <option value="under-20">Under 20 Employees</option>
              <option value="20-50">20 to 50 Employees</option>
              <option value="50-200">50 to 200 Employees</option>
              <option value="200-plus">200+ Employees</option>
            </select>
          </div>
        </div>

        <div>
          <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Primary Compliance Requirements</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: var(--text-sm);"><input type="checkbox" name="service_posh" value="yes"> POSH Act IC Setup & Policy</label>
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: var(--text-sm);"><input type="checkbox" name="service_pf_esic" value="yes"> PF & ESIC Registration/Filings</label>
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: var(--text-sm);"><input type="checkbox" name="service_handbook" value="yes"> Employee Handbook Drafting</label>
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: var(--text-sm);"><input type="checkbox" name="service_audit" value="yes"> Full Labour Code Healthcheck</label>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Contact Person Name</label>
            <input type="text" name="contact_name" required placeholder="Full Name" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Mobile Number</label>
            <input type="tel" name="phone" required placeholder="9876543210" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div>
          <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Email Address</label>
          <input type="email" name="email" required placeholder="hr@company.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
        </div>

        <button type="submit" class="if-btn-primary" style="margin-top: 1rem; width: 100%; padding: 0.85rem; font-size: 1rem;">Submit HR Audit Request for Retainer Proposal</button>
      </form>
    </div>
  </main>

  <div id="global-footer"></div>
  <script src="/assets/js/navigation.js"></script>
  <script src="/assets/js/forms.js"></script>
</body>
</html>
