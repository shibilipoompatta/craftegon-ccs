    <div class="if-service-hero" style="text-align: left; padding: 2rem 0;">
      <h1>Secretarial Audit Applicability & Proposal Request</h1>
      <p>Submit your corporate financial parameters to determine mandatory MR-3 applicability and receive a tailored audit scope and fee proposal.</p>
    </div>

    <div style="background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 2.5rem; box-shadow: var(--shadow-sm);">
      <form class="if-lead-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Corporate Entity Name</label>
            <input type="text" name="entity_name" required placeholder="e.g. Enterprise Limited" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Company Classification</label>
            <select name="company_type" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
              <option value="listed">Listed Public Company</option>
              <option value="unlisted-public">Unlisted Public Company</option>
              <option value="large-private">Large Private Company (Paid-up Cap ≥ ₹50Cr / Turnover ≥ ₹250Cr)</option>
              <option value="standard-private">Standard Private Company (Voluntary Audit)</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Paid-up Share Capital</label>
            <input type="text" name="paid_up_capital" required placeholder="e.g. ₹50 Crores" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Annual Turnover</label>
            <input type="text" name="turnover" required placeholder="e.g. ₹250 Crores" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Audit Committee Chair / Contact Name</label>
            <input type="text" name="contact_name" required placeholder="Full Name & Designation" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Direct Phone Number</label>
            <input type="tel" name="phone" required placeholder="9876543210" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div>
          <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Official Email Address</label>
          <input type="email" name="email" required placeholder="cs@enterprise.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
        </div>

        <button type="submit" class="if-btn-primary" style="margin-top: 0.5rem; width: 100%; padding: 0.85rem; font-size: 1rem;">Request Secretarial Audit Scope & Proposal</button>
      </form>
    </div>
