  <main class="container" style="padding: 3rem 1.5rem; max-width: 800px;">

    <div class="if-service-hero" style="text-align: left; padding: 2rem 0;">
      <h1>Venture Deal Structuring & Cap Table Strategy Consultation</h1>
      <p>Schedule a priority strategy session with our senior Company Secretary (CS) and venture transaction partners to structure your seed or Series A round.</p>
    </div>

    <div style="background: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 2.5rem; box-shadow: var(--shadow-sm);">
      <form class="if-lead-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Startup / Entity Name</label>
            <input type="text" name="startup_name" required placeholder="e.g. CraftEgon Technologies" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Current Funding Stage</label>
            <select name="funding_stage" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
              <option value="bootstrapped">Bootstrapped / Pre-Seed</option>
              <option value="seed">Seed Round</option>
              <option value="series-a">Series A</option>
              <option value="series-b-plus">Series B & Beyond</option>
            </select>
          </div>
        </div>

        <div>
          <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Primary Transaction Requirement</label>
          <select name="transaction_type" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: white;">
            <option value="cap-table">Pre/Post-Money Cap Table Management & Restructuring</option>
            <option value="valuation">Rule 11UA Valuation Certificate Issuance</option>
            <option value="pas-3">Form PAS-3 Return of Allotment Execution</option>
            <option value="full-round">End-to-End Investment Round Execution (SHA/SSA/PAS-3)</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Founder / Contact Name</label>
            <input type="text" name="contact_name" required placeholder="Full Name" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
          <div>
            <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Mobile Number</label>
            <input type="tel" name="phone" required placeholder="9876543210" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div>
          <label style="display: block; font-size: var(--text-sm); font-weight: 500; margin-bottom: 0.25rem;">Email Address</label>
          <input type="email" name="email" required placeholder="founder@startup.com" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
        </div>

        <button type="submit" class="if-btn-primary" style="margin-top: 1rem; width: 100%; padding: 0.85rem; font-size: 1rem;">Schedule Priority Strategy Call with CS Partner</button>
      </form>
    </div>
